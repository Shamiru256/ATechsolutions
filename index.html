  <style>
    /* Colours taken from the Aura Tech logo: black, red and white */
    :root {
      --black: #0a0a0a;
      --black-2: #1a1a1a;
      --red: #e3101e;
      --red-dark: #b00b16;
      --red-light: #ff4d57;
      --white: #ffffff;
      --bg: #f6f6f6;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f5f66;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1140px, 92%); margin: 0 auto; }
    section { padding: 84px 0; }
    .section-title { text-align: center; margin-bottom: 48px; }
    .section-title span { color: var(--red); font-weight: 700; letter-spacing: 2px; font-size: .8rem; text-transform: uppercase; }
    .section-title h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); color: var(--black); margin: 6px 0 10px; }
    .section-title p { color: var(--muted); max-width: 620px; margin: 0 auto; }

    /* Buttons */
    .btn { display: inline-block; padding: 13px 28px; border-radius: 50px; font-weight: 600; border: none; cursor: pointer; font-size: 1rem; transition: transform .2s, box-shadow .2s, background .2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-red { background: var(--red); color: var(--white); box-shadow: 0 8px 20px rgba(227,16,30,.35); }
    .btn-red:hover { background: var(--red-dark); }
    .btn-outline { border: 2px solid rgba(255,255,255,.7); color: #fff; background: transparent; }
    .btn-outline:hover { background: rgba(255,255,255,.12); }

    /* Navbar */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background .3s, box-shadow .3s; }
    header.scrolled { background: rgba(10,10,10,.96); box-shadow: 0 4px 20px rgba(0,0,0,.4); backdrop-filter: blur(8px); border-bottom: 2px solid var(--red); }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 72px; }
    .logo { display: flex; align-items: center; gap: 10px; color: #fff; font-weight: 800; font-size: 1.15rem; letter-spacing: .5px; }
    .logo-img { width: 52px; height: 52px; border-radius: 50%; display: block; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
    footer .logo-img { width: 78px; height: 78px; }
    .logo small { display: block; font-size: .62rem; font-weight: 700; color: var(--red); letter-spacing: 1.5px; text-transform: uppercase; }
    .nav ul { display: flex; list-style: none; gap: 30px; align-items: center; }
    .nav ul a { color: #e5e5e5; font-weight: 500; transition: color .2s; }
    .nav ul a:hover { color: var(--red-light); }
    .nav ul a.btn { color: #fff; }
    .burger { display: none; background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }

    /* Hero */
    .hero { min-height: 100vh; display: flex; align-items: center; color: #fff; position: relative; overflow: hidden;
      background: radial-gradient(circle at 85% 20%, rgba(227,16,30,.35), transparent 45%), radial-gradient(circle at 5% 95%, rgba(227,16,30,.22), transparent 50%), linear-gradient(135deg, #000, var(--black-2)); padding-top: 90px; }
    .hero::before { content: ""; position: absolute; width: 900px; height: 900px; right: -300px; top: -250px; border-radius: 50%; border: 3px solid rgba(227,16,30,.35); box-shadow: 0 0 0 14px rgba(255,255,255,.04); pointer-events: none; }
    .hero-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 40px; align-items: center; position: relative; }
    .badge { display: inline-block; background: rgba(227,16,30,.15); color: #ff6b73; padding: 6px 16px; border-radius: 50px; font-size: .85rem; font-weight: 600; margin-bottom: 18px; border: 1px solid rgba(227,16,30,.5); }
    .hero h1 { font-size: clamp(2.2rem, 5.5vw, 3.8rem); line-height: 1.12; margin-bottom: 18px; }
    .hero h1 em { font-style: normal; color: var(--red); }
    .hero p { color: #cfcfcf; font-size: 1.1rem; max-width: 520px; margin-bottom: 30px; }
    .tagline { font-style: italic; color: #fff; font-size: 1.05rem; margin: -14px 0 28px; border-bottom: 2px solid var(--red); display: inline-block; padding-bottom: 4px; }
    .hero-actions { display: flex; gap: 14px; flex-wrap: wrap; }
    .hero-logo { position: relative; display: grid; place-items: center; }
    .hero-logo img { width: min(430px, 100%); border-radius: 50%; animation: float 6s ease-in-out infinite; filter: drop-shadow(0 0 40px rgba(227,16,30,.45)); }
    .hero-logo::before { content: ""; position: absolute; width: min(470px, 108%); aspect-ratio: 1; border-radius: 50%; border: 2px dashed rgba(227,16,30,.55); animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hero-card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.15); border-top: 4px solid var(--red); border-radius: 22px; padding: 28px; backdrop-filter: blur(10px); animation: float 6s ease-in-out infinite; }
    .hero-card h3 { margin-bottom: 14px; color: #fff; }
    .hero-card li { list-style: none; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; gap: 10px; color: #e6e6e6; }
    .hero-card li:last-child { border: none; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

    /* Services */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 0 0 26px; box-shadow: var(--shadow); transition: transform .25s, box-shadow .25s; overflow: hidden; border-bottom: 4px solid transparent; height: 100%; }
    .card:hover { transform: translateY(-8px); border-bottom-color: var(--red); box-shadow: 0 18px 40px rgba(0,0,0,.18); }
    .card h3, .card p { padding: 0 24px; }
    .card h3 { color: var(--black); margin: 18px 0 8px; }
    .card p { color: var(--muted); font-size: .96rem; }

    /* Service filter tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: -20px 0 36px; }
    .tabs button { padding: 9px 20px; border-radius: 50px; border: 2px solid var(--black); background: #fff; color: var(--black); font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; transition: background .2s, color .2s, border .2s; }
    .tabs button:hover { border-color: var(--red); color: var(--red); }
    .tabs button.on { background: var(--red); border-color: var(--red); color: #fff; }
    .svc-item.hide { display: none; }

    /* Service photos */
    .photo { height: 200px; position: relative; overflow: hidden; display: grid; place-items: center; font-size: 3rem; background: linear-gradient(135deg, var(--black), var(--red-dark)); }
    .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s; }
    .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.55)); pointer-events: none; }
    .photo .tag { position: absolute; left: 14px; bottom: 12px; z-index: 2; width: 44px; height: 44px; border-radius: 50%; background: var(--black); border: 2px solid var(--red); display: grid; place-items: center; font-size: 1.3rem; }
    .card:hover .photo img { transform: scale(1.08); }

    /* About */
    .about { background: #fff; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; }
    .about h2 { font-size: clamp(1.7rem, 3.5vw, 2.3rem); color: var(--black); margin-bottom: 14px; }
    .about p { color: var(--muted); margin-bottom: 14px; }
    .checks li { list-style: none; padding: 6px 0; font-weight: 500; }
    .checks li::before { content: "✔"; color: var(--red); margin-right: 10px; font-weight: 700; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .stat { background: linear-gradient(135deg, #000, var(--black-2)); color: #fff; border-radius: var(--radius); padding: 28px 20px; text-align: center; border-left: 4px solid var(--red); }
    .stat strong { display: block; font-size: 2.2rem; color: var(--red); }
    .stat span { color: #c9c9c9; font-size: .9rem; }

    /* Process */
    .steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 22px; }
    .step { text-align: center; padding: 10px 16px; }
    .step .num { width: 56px; height: 56px; border-radius: 50%; background: var(--black); border: 3px solid var(--red); color: #fff; font-weight: 800; font-size: 1.3rem; display: grid; place-items: center; margin: 0 auto 14px; box-shadow: 0 0 0 8px rgba(227,16,30,.12); }
    .step h4 { color: var(--black); margin-bottom: 4px; }
    .step p { color: var(--muted); font-size: .93rem; }

    /* Payments strip */
    .pay { background: linear-gradient(135deg, #000, var(--black-2)); color: #fff; padding: 56px 0; text-align: center; border-top: 4px solid var(--red); border-bottom: 4px solid var(--red); }
    .pay h3 { margin-bottom: 18px; font-size: 1.4rem; }
    .pay-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .pay-list span { background: rgba(255,255,255,.08); border: 1px solid rgba(227,16,30,.6); padding: 9px 20px; border-radius: 50px; font-weight: 500; }

    /* Contact */
    .contact-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 34px; }
    .info { background: var(--black); color: #fff; border-radius: var(--radius); padding: 34px; border-top: 4px solid var(--red); height: 100%; }
    .info h3 { color: var(--red); margin-bottom: 18px; }
    .info p { display: flex; gap: 12px; margin-bottom: 16px; color: #dcdcdc; }
    form { background: #fff; border-radius: var(--radius); padding: 34px; box-shadow: var(--shadow); }
    .field { margin-bottom: 16px; }
    label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 6px; color: var(--black); }
    input, select, textarea { width: 100%; padding: 12px 14px; border: 2px solid #e4e4e7; border-radius: 10px; font: inherit; background: #fafafa; transition: border .2s, box-shadow .2s; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 4px rgba(227,16,30,.12); background: #fff; }
    textarea { min-height: 120px; resize: vertical; }
    .err { color: var(--red); font-size: .82rem; margin-top: 4px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .success { background: #dcfce7; color: #166534; padding: 14px 16px; border-radius: 10px; margin-bottom: 16px; font-weight: 500; }

    /* Footer */
    footer { background: #000; color: #b5b5b5; padding: 56px 0 24px; border-top: 4px solid var(--red); }
    .foot-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 30px; margin-bottom: 30px; }
    footer h4 { color: #fff; margin-bottom: 12px; }
    footer li { list-style: none; margin-bottom: 8px; }
    footer a, footer button.link { color: #b5b5b5; background: none; border: none; font: inherit; cursor: pointer; }
    footer a:hover, footer button.link:hover { color: var(--red-light); }
    .copy { border-top: 1px solid rgba(255,255,255,.1); padding-top: 18px; text-align: center; font-size: .88rem; }

    /* Modal */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; display: grid; place-items: center; padding: 20px; }
    .modal { background: #fff; max-width: 640px; width: 100%; max-height: 82vh; overflow: auto; border-radius: 18px; padding: 34px; position: relative; border-top: 5px solid var(--red); }
    .modal h3 { color: var(--black); margin-bottom: 14px; }
    .modal h5 { color: var(--red); margin: 14px 0 4px; }
    .modal p { color: var(--muted); font-size: .95rem; }
    .close { position: absolute; top: 14px; right: 18px; background: none; border: none; font-size: 1.8rem; cursor: pointer; color: var(--muted); }

    .to-top { position: fixed; right: 22px; bottom: 22px; width: 46px; height: 46px; border-radius: 50%; border: none; background: var(--red); color: #fff; font-size: 1.3rem; font-weight: 800; cursor: pointer; box-shadow: var(--shadow); z-index: 40; }

    /* Scroll reveal */
    .reveal { opacity: 0; transform: translateY(26px); transition: opacity .7s, transform .7s; }
    .reveal.show { opacity: 1; transform: none; }

    @media (max-width: 860px) {
      .hero-grid, .about-grid, .contact-grid, .foot-grid { grid-template-columns: 1fr; }
      .hero-card { display: none; }
      .hero-logo { order: -1; margin-top: 10px; }
      .hero-logo img { width: min(260px, 70%); }
      .hero-logo::before { width: min(290px, 78%); }
      .burger { display: block; }
      .nav ul { position: absolute; top: 72px; left: 0; right: 0; background: #000; border-bottom: 2px solid var(--red); flex-direction: column; padding: 20px 0; gap: 18px; display: none; }
      .nav ul.open { display: flex; }
      .row { grid-template-columns: 1fr; }
      section { padding: 64px 0; }
    }

      setTimeout(function () { ok.style.display = "none"; }, 6000);
    });
  </script>
