  <style>
    /* Colours taken from the Aura Tech logo: black, red and white */
    :root {
      --black: #0a0a0a;
      --black-2: #1a1a1a;
      --red: #e3101e;
      --red-dark: #b00b16;
      --red-light: #ff4d57;
      --white: #ffffff;
      --bg: #f6f6f6;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #5f5f66;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text); background: var(--bg); line-height: 1.6; }
    a { text-decoration: none; color: inherit; }
    .container { width: min(1140px, 92%); margin: 0 auto; }
    section { padding: 84px 0; }
    .section-title { text-align: center; margin-bottom: 48px; }
    .section-title span { color: var(--red); font-weight: 700; letter-spacing: 2px; font-size: .8rem; text-transform: uppercase; }
    .section-title h2 { font-size: clamp(1.7rem, 3.5vw, 2.4rem); color: var(--black); margin: 6px 0 10px; }
    .section-title p { color: var(--muted); max-width: 620px; margin: 0 auto; }

    /* Buttons */
    .btn { display: inline-block; padding: 13px 28px; border-radius: 50px; font-weight: 600; border: none; cursor: pointer; font-size: 1rem; transition: transform .2s, box-shadow .2s, background .2s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-red { background: var(--red); color: var(--white); box-shadow: 0 8px 20px rgba(227,16,30,.35); }
    .btn-red:hover { background: var(--red-dark); }
    .btn-outline { border: 2px solid rgba(255,255,255,.7); color: #fff; background: transparent; }
    .btn-outline:hover { background: rgba(255,255,255,.12); }

    /* Navbar */
    header { position: fixed; top: 0; left: 0; right: 0; z-index: 50; transition: background .3s, box-shadow .3s; }
